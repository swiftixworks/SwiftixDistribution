name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    name: Distribution (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out SwiftixDistribution
        uses: actions/checkout@v6
        with:
          path: SwiftixDistribution

      # nano needs the Swiftix 0.12 terminal ABI and strings package from
      # swiftixworks/Swiftix#1; pin the v0.12.0 tag once that release ships.
      - name: Check out Swiftix toolchain
        uses: actions/checkout@v6
        with:
          repository: swiftixworks/Swiftix
          ref: feat/go-terminal-abi
          path: Swiftix

      - name: Check out coreutils package
        uses: actions/checkout@v6
        with:
          repository: swiftixworks/coreutils
          ref: v1.0.0
          path: coreutils

      # editors has no release tag yet, so pin the exact commit that built
      # editors_0.1.0.pkg.
      - name: Check out editors package
        uses: actions/checkout@v6
        with:
          repository: swiftixworks/editors
          ref: 6c5b193076911a097e09d2fc9abebdfea514fc8c
          path: editors

      - name: Check out sysutils package
        uses: actions/checkout@v6
        with:
          repository: swiftixworks/sysutils
          ref: v0.1.0
          path: sysutils

      - name: Install Swift 6.3.3
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev gpg
          swiftly_archive="${RUNNER_TEMP}/swiftly-$(uname -m).tar.gz"
          swiftly_bootstrap="${RUNNER_TEMP}/swiftly-bootstrap"
          swiftly_post_install="${RUNNER_TEMP}/swiftly-post-install.sh"
          mkdir -p "${swiftly_bootstrap}"
          curl --fail --location --silent --show-error \
            "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" \
            --output "${swiftly_archive}"
          tar --extract --gzip --file "${swiftly_archive}" --directory "${swiftly_bootstrap}"
          export SWIFTLY_HOME_DIR="${RUNNER_TEMP}/swiftly-home"
          export SWIFTLY_BIN_DIR="${RUNNER_TEMP}/swiftly-bin"
          "${swiftly_bootstrap}/swiftly" init \
            --skip-install \
            --quiet-shell-followup \
            --assume-yes \
            --no-modify-profile
          export PATH="${SWIFTLY_BIN_DIR}:${PATH}"
          swiftly install 6.3.3 \
            --use \
            --assume-yes \
            --post-install-file "${swiftly_post_install}"
          if [[ -f "${swiftly_post_install}" ]]; then
            bash "${swiftly_post_install}"
          fi
          swift_location="$(swiftly use --print-location)"
          printf 'SWIFTLY_HOME_DIR=%s\nSWIFTLY_BIN_DIR=%s\n' \
            "${SWIFTLY_HOME_DIR}" "${SWIFTLY_BIN_DIR}" >> "${GITHUB_ENV}"
          printf '%s\n' "${SWIFTLY_BIN_DIR}" "${swift_location}" >> "${GITHUB_PATH}"

      - name: Show Swift toolchain
        run: swift --version

      - name: Build with warnings as errors
        working-directory: SwiftixDistribution
        run: swift build -Xswiftc -warnings-as-errors

      - name: Verify checked-in distribution image
        working-directory: SwiftixDistribution
        run: swift run SwiftixDistributionBuilder --check

      - name: Prove deterministic rebuilds
        working-directory: SwiftixDistribution
        run: |
          swift run SwiftixDistributionBuilder --output "${RUNNER_TEMP}/swiftix-minimal-a.sximg"
          swift run SwiftixDistributionBuilder --output "${RUNNER_TEMP}/swiftix-minimal-b.sximg"
          cmp "${RUNNER_TEMP}/swiftix-minimal-a.sximg" "${RUNNER_TEMP}/swiftix-minimal-b.sximg"

      - name: Run tests with warnings as errors
        working-directory: SwiftixDistribution
        run: swift test -Xswiftc -warnings-as-errors

      - name: Check whitespace
        working-directory: SwiftixDistribution
        run: git diff --check
